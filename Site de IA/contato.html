<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contato – Fase Bônus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="wrap bar"><a class="logo" href="index.html">Fase Bônus</a>
            <nav><a href="index.html">Início</a><a href="catalogo.html">Catálogo</a><a href="contato.html"
                    aria-current="page">Contato</a></nav><a class="btn" href="carrinho.html">Carrinho (2)</a>
        </div>
    </header>
    <main>
        <div class="wrap">
            <h1>Contato</h1>
            <div class="cols">
                <form class="panel" action="#"><label for="n">Nome</label><input id="n" type="text"><label
                        for="e">E-mail</label><input id="e" type="email"><label for="s">Assunto</label><select id="s">
                        <option>Dúvida sobre um item</option>
                        <option>Vender ou trocar meus games</option>
                        <option>Assistência técnica</option>
                        <option>Outro assunto</option>
                    </select><label for="m">Mensagem</label><textarea id="m"></textarea>
                    <p><button class="btn" type="submit">Enviar mensagem</button></p>
                </form>
                <aside class="panel">
                    <h2>Fale com a gente</h2>
                    <p><strong>Endereço</strong><br>Rua do Cartucho, 16, São Paulo, SP</p>
                    <p><strong>Horário</strong><br>Segunda a sábado, das 10h às 19h</p>
                    <p><strong>WhatsApp</strong><br>(11) 90000-0000</p>
                    <p><strong>E-mail</strong><br>contato@fasebonus.example</p>
                    <div class="thumb g16" style="aspect-ratio:16/9;border:var(--line);border-radius:8px">Mapa</div>
                </aside>
            </div>
        </div>
    </main>
    <footer>
        <div class="wrap">
            <p>© 2026 Fase Bônus, loja fictícia de games retrô.</p>
        </div>
    </footer>
</body>

</html>
